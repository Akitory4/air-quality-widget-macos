name: Release

# Triggers on every tag that looks like a version (e.g. `0.1.0-beta`, `0.2.0`,
# `v1.0.0`). Builds the Release .app, packages it into a drag-to-Applications
# DMG and a parallel Sparkle ZIP, attaches both to the matching GitHub Release,
# then publishes the signed Sparkle appcast to the gh-pages branch.
#
# Notes on signing:
# - We use ad-hoc ("Sign to Run Locally") signing — same as local `make dmg`.
#   Users are instructed in README to right-click → Open on first launch.
# - When/if a Developer ID cert is added, this workflow is the place to wire
#   `IMPORT_P12_BASE64` + `IMPORT_P12_PASSWORD` secrets + a `notarytool submit`
#   step. Not in scope for 0.1.0-beta.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # required to upload release assets

jobs:
  build-dmg:
    name: Build DMG & ZIP
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install build tooling
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive Release .app
        run: make archive

      - name: Build DMG
        run: make package-dmg

      - name: Build ZIP
        run: make package-zip

      - name: Locate Sparkle signing tool
        id: sparkle
        run: |
          SIGN_UPDATE=$(find build -path '*/Sparkle/bin/sign_update' -type f | head -n 1)
          if [[ -z "$SIGN_UPDATE" ]]; then
            echo "Sparkle sign_update tool was not found in build artifacts." >&2
            exit 1
          fi
          echo "sign_update=$SIGN_UPDATE" >> "$GITHUB_OUTPUT"

      - name: Generate Sparkle appcast
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_SIGN_UPDATE: ${{ steps.sparkle.outputs.sign_update }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_ED_KEY" ]]; then
            echo "SPARKLE_PRIVATE_ED_KEY secret is required to sign the Sparkle update." >&2
            exit 1
          fi
          scripts/generate_appcast.sh

      - name: Collect artefacts
        id: artefacts
        run: |
          # `make archive` writes to build/Release. Pick up whatever DMG/ZIP
          # make produced (filenames include MARKETING_VERSION).
          DMG=$(ls build/Release/*.dmg | head -n 1)
          ZIP=$(ls build/Release/*.zip | head -n 1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found:"
          echo "  DMG: $DMG"
          echo "  ZIP: $ZIP"

      - name: Upload to workflow artefacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: airsense-${{ github.ref_name }}
          path: |
            build/Release/*.dmg
            build/Release/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The Release for this tag is created/updated implicitly; if the user
          # already created it from the web UI, assets are just appended.
          files: |
            ${{ steps.artefacts.outputs.dmg }}
            ${{ steps.artefacts.outputs.zip }}
          # Keep release body intact (don't clobber manual notes).
          append_body: false
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Publish appcast to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PAGES_DIR="$(mktemp -d)"
          cp -R docs/. "$PAGES_DIR/"
          touch "$PAGES_DIR/.nojekyll"

          git -C "$PAGES_DIR" init
          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" checkout -b gh-pages
          git -C "$PAGES_DIR" add .
          git -C "$PAGES_DIR" commit -m "Publish appcast for ${GITHUB_REF_NAME}"
          git -C "$PAGES_DIR" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$PAGES_DIR" push --force origin HEAD:gh-pages
